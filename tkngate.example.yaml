server:
  port: 7477
  host: "127.0.0.1"

providers:
  openai:
    api_key: "sk-proj-xxx"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-6o"
  anthropic:
    api_key: "sk-ant-xxx"
    base_url: "https://api.anthropic.com/v1"
    default_model: "claude-4.8-opus"

budget:
  global_limit_usd: 50.00
  max_session_cost_usd: 5.00
  fallback_model: "gpt-4o-mini"
  fallback_provider: "deepseek"
  amber_threshold_pct: 70   # Switch to amber at 70% spend
  red_threshold_pct: 95     # Hard block at 95% spend
  reset_interval: "monthly"

compressor:
  enabled: true
  soft_token_limit: 4000
  strategy: "go-ast"

cache:
  enabled: true
  max_entries: 512          # Max cached responses in memory
  ttl_seconds: 300          # Cache entries expire after 5 minutes

telemetry:
  enabled: true
  host: "127.0.0.1"
  port: 7478

shadow:
  enabled: false
  target_provider: "deepseek"
  target_model: "deepseek-chat-v3"
  traffic_fraction: 0.1
