server:
  port: 7477
  host: "127.0.0.1"

providers:
  openai:
    api_key: "sk-proj-YOUR_OPENAI_KEY_HERE"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o"
  anthropic:
    api_key: "sk-ant-YOUR_ANTHROPIC_KEY_HERE"
    base_url: "https://api.anthropic.com/v1"
    default_model: "claude-sonnet-4-20250514"
  gemini:
    api_key: "YOUR_GEMINI_KEY_HERE"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    default_model: "gemini-1.5-pro"

budget:
  global_limit_usd: 50.00
  max_session_cost_usd: 5.00
  fallback_model: "gpt-4o-mini"
  fallback_provider: "deepseek"
  amber_threshold_pct: 70
  red_threshold_pct: 95
  reset_interval: "monthly"

compressor:
  enabled: true
  soft_token_limit: 4000
  strategy: "go-ast"
  enable_go: true
  enable_python: true
  enable_js: true

cache:
  enabled: true
  max_entries: 512
  ttl_seconds: 300
  # redis_uri: "redis://localhost:6379"  # Uncomment for distributed caching

telemetry:
  enabled: true
  host: "127.0.0.1"
  port: 7478

shadow:
  enabled: false
  target_provider: "deepseek"
  target_model: "deepseek-chat"
  traffic_fraction: 0.1

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst_size: 10

mesh:
  reputation_enabled: false
  preflight_moderation: false
  # moderation_api_key: "sk-proj-YOUR_OPENAI_KEY"  # Required if preflight_moderation is true
  initial_trust_score: 50.0
  slash_penalty: 25.0
  blacklist_threshold: 10.0
  premium_trust_minimum: 80.0
  free_rider_limit: 10000  # Max tokens a session can draw from the P2P pool before being rate-limited

waf:
  enabled: true
  blocklist:
    - "(?i)competitor_name"            # Block case-insensitive mentions of a competitor
    - "(?i)ignore all previous"        # Block classic prompt injections
    - "\\b4[0-9]{12}(?:[0-9]{3})?\\b"  # Custom regex for Visa credit cards

p2p:
  enabled: true
  listen_port: 7479
  bootstrap_peers: []
  enable_relay: true
  enable_mdns: true
  max_peers: 100

cluster:
  enabled: false
  node_id: "node-1"
  redis_uri: "redis://localhost:6379"

audit:
  enabled: false
  sink_url: "https://http-intake.logs.datadoghq.com/v1/input"
  format: "json"
