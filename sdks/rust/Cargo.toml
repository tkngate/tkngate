[package]
name = "tkngate"
version = "1.0.0"
edition = "2021"
authors = ["Tkngate <hello@tkngate.com>"]
description = "Official Rust middleware SDK for Tkngate. A zero-trust P2P gateway for LLM agents."
homepage = "https://tkngate.com"
repository = "https://github.com/tkngate/tkngate"
license = "Apache-2.0"
keywords = ["llm", "ai", "middleware", "api", "tkngate"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.11", default-features = false }
reqwest-middleware = "0.2"
async-trait = "0.1"
task-local-extensions = "0.1"
